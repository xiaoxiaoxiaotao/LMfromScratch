[project]
name = "cs336_basics"
version = "1.0.5"
description = "CS336 Assignment 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1", # tensor operations
    "einx>=0.3.0", # more general tensor operations
    "jaxtyping>=0.3.0", # type hints for pytorch/jax/numpy
    "numpy",
    "psutil>=6.1.1",
    "pytest>=8.3.4",
    "regex>=2024.11.6", # more powerful regex than the builtin `re` module
    "submitit>=1.5.2", # job submission for SLURM
    "tiktoken>=0.9.0",
    "torch~=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch~=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
    "tqdm>=4.67.1",
    "wandb>=0.19.7",
    "ty>=0.0.1a16",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# 指定包结构：自动发现 src/ 或根目录下的模块
[tool.setuptools.packages.find]
where = ["."]  # 包在根目录下，如 cs336_basics/
# 如果你的代码在 src/cs336_basics/ 下，请改为: where = ["src"]
# namespaces = false

# 可选：如果你有数据文件需要包含
# [tool.setuptools.package-data]
# "cs336_basics" = ["data/*.txt", "configs/*.yaml"]

# 测试配置保持不变
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

# 代码格式与 lint 工具
[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = [
    "F722"
]